<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PortNes</title>
<style>
  :root {
    --bg: #0d0d10; --panel: #18181d; --text: #e8e8ea; --muted: #8b8b95;
    --accent: #e0362c; --ok: #3fb950; --border: #2a2a32;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; }
  header { width: 100%; max-width: 1320px; padding: 12px 16px; display: flex;
    align-items: center; gap: 8px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0 8px 0 0; letter-spacing: .08em; color: var(--accent); }
  .spacer { flex: 1; }
  button, label.btn { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover, label.btn:hover { border-color: var(--accent); }
  .vol { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 10px 2px 2px; }
  .vol button { border: 0; background: transparent; padding: 4px 6px; font-size: 15px; line-height: 1; }
  .vol input[type=range] { width: 90px; accent-color: var(--accent); cursor: pointer; margin: 0; }
  #volLabel { font: 12px ui-monospace, monospace; color: var(--muted); min-width: 3.5ch; text-align: right; }
  #gameSelect { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 28px 6px 10px; font: inherit; cursor: pointer; max-width: 220px; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
  #gameSelect:hover, #gameSelect:focus { border-color: var(--accent); outline: none; }
  #gameSelect option { background: var(--panel); color: var(--text); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #netStatus { font-size: 12px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--ok); color: var(--ok); }
  #netStatus.wait { border-color: #d29922; color: #d29922; }
  /* Zona principal: juego a la izquierda, controles a la derecha. El canvas se ajusta al
     espacio libre real (container queries), así nunca tapa la barra ni el panel. */
  main { width: 100%; max-width: 1320px; flex: 1; min-height: 0; display: flex; gap: 16px; padding: 0 16px 16px; }
  #stage { position: relative; flex: 1; min-width: 0; min-height: 0; container-type: size;
    display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; display: block;
    width: min(100cqw, 100cqh * var(--ar, 1)); height: auto; aspect-ratio: var(--ar, 1);
    border: 1px solid var(--border); }

  /* Panel de controles */
  #help { flex: none; width: 270px; overflow-y: auto; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px 14px 14px; font-size: 13px; }
  #help h2 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    margin: 12px 0 2px; }
  #help ul { list-style: none; margin: 0; padding: 0; }
  #help li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 0;
    border-bottom: 1px solid var(--border); }
  #help li:last-child { border-bottom: 0; }
  #help li .keys { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 3px; }
  #help p { margin: 10px 0 0; color: var(--muted); font-size: 12px; }

  /* Pantallas estrechas: panel debajo del juego y la página puede desplazarse */
  @media (max-width: 820px) {
    html, body { height: auto; min-height: 100%; }
    main { flex-direction: column; flex: none; }
    #stage { container-type: inline-size; flex: none; }
    canvas { width: 100%; }
    #help { width: auto; overflow: visible; }
  }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; text-align: center; pointer-events: none; }
  #overlay .box { background: rgba(0,0,0,.8); padding: 18px 24px; border-radius: 8px; pointer-events: auto;
    border: 1px solid var(--border); max-width: 90%; }
  #overlay.hidden { display: none; }
  kbd { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px;
    font: 12px ui-monospace, monospace; color: var(--text); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel);
    border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s;
    pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; }

  /* Panel online */
  #netPanel { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center;
    justify-content: center; padding: 16px; z-index: 10; }
  #netPanel .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
  #netPanel h2 { margin: 0; font-size: 17px; }
  #netPanel p { margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; }
  .row.end { justify-content: flex-end; }
  .row input { flex: 1; min-width: 0; }
  input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font: inherit; }
  #joinCode { text-transform: uppercase; letter-spacing: .2em; font-family: ui-monospace, monospace; }
  .code { font: 700 34px/1 ui-monospace, monospace; letter-spacing: .25em; text-align: center; padding: 10px;
    background: var(--bg); border: 1px dashed var(--border); border-radius: 8px; color: var(--accent); }
  .sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  .sep::before, .sep::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
  .err { color: #ff7b72; font-size: 13px; min-height: 1em; }

  /* Controles táctiles */
  #touch { display: none; width: 100%; max-width: 600px; padding: 10px 16px 20px; gap: 8px;
    justify-content: space-between; align-items: center; user-select: none; -webkit-user-select: none; }
  @media (pointer: coarse) { #touch { display: flex; } #help { display: none; } }
  .dpad { display: grid; grid-template: repeat(3, clamp(40px, 12vw, 52px)) / repeat(3, clamp(40px, 12vw, 52px)); gap: 2px; }
  .tb { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: flex;
    align-items: center; justify-content: center; font-weight: 600; touch-action: none; }
  .tb.on { background: var(--accent); }
  .mid { display: flex; flex-direction: column; gap: 8px; }
  .mid .tb { padding: 6px 12px; font-size: 11px; }
  .ab { display: flex; gap: clamp(8px, 3vw, 14px); }
  .ab .tb { width: clamp(50px, 15vw, 64px); height: clamp(50px, 15vw, 64px); border-radius: 50%; font-size: 18px; }
</style>
</head>
<body>
<header>
  <h1 id="appName">PortNes</h1>
  <button id="btnOnline" class="primary">Online</button>
  <span id="netStatus" hidden></span>
  <span class="spacer"></span>
  <button id="btnPause" title="P">Pausa</button>
  <button id="btnReset">Reset</button>
  <button id="btnSave" title="F5">Guardar</button>
  <button id="btnLoad" title="F9">Cargar</button>
  <div class="vol" title="Volumen (M silenciar · - / + ajustar)">
    <button id="btnMute" aria-label="Silenciar">🔊</button>
    <input id="volume" type="range" min="0" max="100" step="1" value="80" aria-label="Volumen">
    <span id="volLabel">80%</span>
  </div>
  <button id="btnFull" title="F">Pantalla completa</button>
  <select id="gameSelect" aria-label="Juego" title="Elegir juego">
    <option value="" disabled selected>Elegir juego…</option>
  </select>
  <input id="fileInput" type="file" hidden>
  <button id="btnForget" title="Borra la ROM guardada en este navegador">Olvidar ROM</button>
</header>

<main>
  <div id="stage">
    <canvas id="screen"></canvas>
    <div id="overlay"><div class="box" id="overlayText">Cargando…</div></div>
  </div>

  <aside id="help" aria-label="Controles"><!-- generado desde CONFIG.help --></aside>
</main>

<div id="touch"><!-- generado desde CONFIG.touch --></div>


<div id="netPanel" hidden>
  <div class="card" role="dialog" aria-labelledby="netTitle">
    <h2 id="netTitle">Partida online</h2>

    <div id="netIdle">
      <p class="muted">Ambos jugadores necesitan tener cargada la misma ROM. Quien crea la partida es el
        Jugador 1 y elige el modo de 2 jugadores en el menú del juego.</p>
      <p style="margin-top:12px"><button id="btnHost" class="primary" style="width:100%">Crear partida</button></p>
      <div class="sep" style="margin:12px 0">o</div>
      <div class="row">
        <input id="joinCode" type="text" placeholder="CÓDIGO" maxlength="5" autocomplete="off" spellcheck="false">
        <button id="btnJoin" class="primary">Unirse como Jugador 2</button>
      </div>
    </div>

    <div id="netWaiting" hidden>
      <p>Comparte este código o enlace con el Jugador 2:</p>
      <div class="code" id="roomCode">-----</div>
      <div class="row"><input id="roomLink" type="text" readonly><button id="btnCopy">Copiar</button></div>
      <p class="muted" id="waitMsg">Esperando al Jugador 2…</p>
    </div>

    <div id="netLive" hidden><p id="liveMsg"></p></div>

    <p class="err" id="netError"></p>
    <div class="row end">
      <button id="btnLeave" hidden>Salir de la partida online</button>
      <button id="btnClose">Cerrar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- NÚCLEO del sistema: librería + adaptador (SPEC.md §4). Cambiar estas dos líneas para otro emulador. -->
<script src="vendor/jsnes.min.js"></script>
<script src="cores/nes.js"></script>
<!-- Configuración del emulador (SPEC.md §3) -->
<script src="config.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script>
(() => {
  'use strict';
  // =====================================================================
  //  SHELL GENÉRICO DE EMULADOR WEB (SPEC.md). No contiene nada específico
  //  de la consola: todo sale de window.CONFIG (config.js) y del núcleo
  //  window.EmulatorCore (cores/<sistema>.js).
  // =====================================================================
  const $ = id => document.getElementById(id);
  const C = window.CONFIG, CORE = window.EmulatorCore;
  if (!C || !CORE) { document.body.textContent = 'Falta config.js o el núcleo del emulador.'; return; }
  const INFO = CORE.info, NET = C.netplay;
  const W = INFO.width, H = INFO.height;
  const FRAME_MS = 1000 / INFO.fps;
  const EMU_RATE = INFO.sampleRate;
  const PLAYERS = INFO.players;
  const BTN = Object.fromEntries(INFO.buttons.map((n, i) => [n, i])); // nombre de botón → bit
  const NBTN = INFO.buttons.length;
  const EXT_TXT = INFO.extensions.join(', ');
  const EXT_RE = new RegExp('(' + INFO.extensions.map(e => e.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')$', 'i');

  // ---------- Vídeo ----------
  const canvas = $('screen');
  canvas.width = W; canvas.height = H;
  document.documentElement.style.setProperty('--ar', W / H);
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(W, H);
  const buf32 = new Uint32Array(image.data.buffer);

  // ---------- Audio (frecuencia fija del núcleo, remuestreo a la del dispositivo) ----------
  const AUDIO_BUF = 16384, AUDIO_MASK = AUDIO_BUF - 1;
  const audioL = new Float32Array(AUDIO_BUF), audioR = new Float32Array(AUDIO_BUF);
  let audioW = 0, audioRd = 0, audioFrac = 0, audioCtx = null, gain = null, muted = false;

  function initAudio() {
    if (audioCtx) { if (audioCtx.state === 'suspended' && !paused) audioCtx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { audioCtx = new AC({ sampleRate: EMU_RATE }); } catch (e) { audioCtx = new AC(); }
    const step = EMU_RATE / audioCtx.sampleRate;
    gain = audioCtx.createGain();
    gain.gain.value = outputGain();
    const node = audioCtx.createScriptProcessor(1024, 0, 2);
    node.onaudioprocess = (e) => {
      const outL = e.outputBuffer.getChannelData(0), outR = e.outputBuffer.getChannelData(1);
      for (let i = 0; i < outL.length; i++) {
        if (audioRd !== audioW) {
          outL[i] = audioL[audioRd]; outR[i] = audioR[audioRd];
          audioFrac += step;
          while (audioFrac >= 1 && audioRd !== audioW) { audioRd = (audioRd + 1) & AUDIO_MASK; audioFrac -= 1; }
        } else { outL[i] = outR[i] = 0; }
      }
    };
    node.connect(gain); gain.connect(audioCtx.destination);
  }

  // ---------- Núcleo ----------
  const core = CORE.create({
    onFrame(px) { for (let i = 0; i < W * H; i++) buf32[i] = 0xFF000000 | px[i]; },
    onAudioSample(l, r) {
      const next = (audioW + 1) & AUDIO_MASK;
      if (next === audioRd) return; // buffer lleno: descartar
      audioL[audioW] = l; audioR[audioW] = r; audioW = next;
    },
  });

  // ---------- Entrada: estado por jugador como máscara de bits ----------
  // "latched" garantiza que una pulsación rapidísima dure al menos 1 cuadro.
  const held = new Array(PLAYERS + 1).fill(0), latched = new Array(PLAYERS + 1).fill(0);
  function press(p, b) { held[p] |= 1 << b; latched[p] |= 1 << b; }
  function release(p, b) { held[p] &= ~(1 << b); }
  function sample(p) { const v = held[p] | latched[p]; latched[p] = 0; return v; }
  function sampleAll() { const m = []; for (let p = 1; p <= PLAYERS; p++) m.push(sample(p)); return m; }
  function sampleMerged() { let v = 0; for (let p = 1; p <= PLAYERS; p++) v |= sample(p); return v; }
  function releaseAll() { held.fill(0); }

  // ---------- Bucle principal ----------
  let running = false, paused = false, last = 0, acc = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (!running || (paused && !net.active)) { last = t; return; }
    acc += Math.min(t - last, 100); last = t;
    pollGamepads();
    let ran = false;
    if (net.active) ran = netStep(t);
    else {
      while (acc >= FRAME_MS) { core.setInputs(sampleAll()); core.runFrame(); acc -= FRAME_MS; ran = true; }
    }
    if (ran) ctx.putImageData(image, 0, 0);
  }

  // ---------- Carga de ROM ----------
  const overlay = $('overlay'), overlayText = $('overlayText');
  function showOverlay(html) { overlayText.innerHTML = html; overlay.classList.remove('hidden'); }
  function hideOverlay() { overlay.classList.add('hidden'); }
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function sha256(bytes) {
    const d = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(d), x => x.toString(16).padStart(2, '0')).join('');
  }

  let romKey = 'rom', romHash = null;
  function startRom(bytes, name) {
    const invalid = CORE.validate(bytes);
    if (invalid) { showOverlay(escapeHtml(invalid)); return false; }
    try { core.load(bytes); }
    catch (e) { showOverlay('No se pudo cargar la ROM: ' + escapeHtml(e.message)); return false; }
    currentGame = findGame(name) ? findGame(name).name : null;
    syncGameSelect();
    romKey = (name || 'rom').toLowerCase();
    romHash = sha256(bytes);
    running = true; paused = false; acc = 0;
    showOverlay('<b>Pulsa cualquier tecla o toca la pantalla para empezar</b><br><small>(los navegadores exigen una interacción para activar el sonido)</small>');
    const go = () => { initAudio(); hideOverlay();
      ['keydown','pointerdown'].forEach(ev => window.removeEventListener(ev, go)); };
    ['keydown','pointerdown'].forEach(ev => window.addEventListener(ev, go));
    // Enlace de invitación (?sala=CODIGO): unirse automáticamente al tener la ROM
    if (inviteCode && !net.peer) { const c = inviteCode; inviteCode = null; openPanel(); joinRoom(c); }
    return true;
  }

  // ---------- Catálogo de juegos, siempre en orden alfabético ----------
  let games = [], currentGame = null;
  const collator = new Intl.Collator('es', { sensitivity: 'base', numeric: true });
  const findGame = name => name ? games.find(g => collator.compare(g.name, name) === 0) : null;

  function loadCatalog() {
    return fetch(C.catalogUrl, { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(list => {
        games = (Array.isArray(list) ? list : [])
          .filter(g => g && typeof g.name === 'string' && typeof g.url === 'string')
          .sort((a, b) => collator.compare(a.name, b.name));
      })
      .catch(e => { console.warn('No se pudo leer el catálogo', C.catalogUrl, e); games = []; })
      .then(buildGameSelect);
  }
  function buildGameSelect() {
    const sel = $('gameSelect');
    sel.innerHTML = '';
    const ph = new Option(games.length ? 'Elegir juego…' : 'Sin juegos', '');
    ph.disabled = true; sel.add(ph);
    for (const g of games) sel.add(new Option(g.name, g.name));
    const sep = new Option('──────────', ''); sep.disabled = true; sel.add(sep);
    sel.add(new Option('Abrir archivo ' + EXT_TXT + '…', '__file'));
    syncGameSelect();
  }
  function syncGameSelect() {
    const sel = $('gameSelect');
    sel.value = currentGame && findGame(currentGame) ? currentGame : '';
    sel.title = currentGame ? 'Jugando a ' + currentGame : 'Elegir juego';
  }

  async function loadGame(name) {
    const g = findGame(name);
    if (!g) { toast('Juego no encontrado: ' + name); syncGameSelect(); return false; }
    if (net.peer) { toast('Sal de la partida online antes de cambiar de juego'); syncGameSelect(); return false; }
    showOverlay('Descargando <b>' + escapeHtml(g.name) + '</b>…');
    try {
      const r = await fetch(g.url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const bytes = new Uint8Array(await r.arrayBuffer());
      if (!startRom(bytes, g.name)) { syncGameSelect(); return false; }
      storeRom(bytes, g.name);
      return true;
    } catch (e) {
      console.warn('Descarga fallida', g.url, e);
      showOverlay('No se pudo descargar <b>' + escapeHtml(g.name) + '</b>.<br><small>' +
        (e instanceof TypeError ? 'El servidor de ROMs no permite la descarga desde esta página (CORS) o no hay conexión.' : escapeHtml(e.message)) +
        '</small>' + (running ? '<br><br><small>Pulsa cualquier tecla o toca la pantalla para seguir con el juego actual.</small>' : ''));
      if (running) {
        const close = () => { hideOverlay(); ['keydown', 'pointerdown'].forEach(ev => window.removeEventListener(ev, close)); };
        setTimeout(() => ['keydown', 'pointerdown'].forEach(ev => window.addEventListener(ev, close)), 0);
      }
      syncGameSelect();
      return false;
    }
  }

  $('gameSelect').addEventListener('change', e => {
    const v = e.target.value;
    e.target.blur();                       // devolver el teclado al juego
    if (v === '__file') { syncGameSelect(); $('fileInput').click(); return; }
    if (v) loadGame(v);
  });

  // ROM recordada en este navegador (IndexedDB; nunca sale del equipo)
  function idb() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(C.storage.db, 1);
      req.onupgradeneeded = () => req.result.createObjectStore('roms');
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  function idbOp(mode, fn) {
    return idb().then(db => new Promise((res, rej) => {
      const tx = db.transaction('roms', mode), r = fn(tx.objectStore('roms'));
      tx.oncomplete = () => res(r && r.result);
      tx.onerror = () => rej(tx.error);
    }));
  }
  const storeRom = (bytes, name) => idbOp('readwrite', s => s.put({ bytes, name }, 'last')).catch(() => {});
  const getStoredRom = () => idbOp('readonly', s => s.get('last')).catch(() => null);
  const forgetRom = () => idbOp('readwrite', s => s.delete('last')).catch(() => {});

  const NO_ROM_MSG = '<b>Elige un juego en la lista</b><br>o arrastra aquí un archivo ' + escapeHtml(EXT_TXT);

  const params = new URLSearchParams(location.search);
  let inviteCode = (params.get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g, '') || null;
  const inviteGame = params.get('juego');

  function loadFile(file) {
    if (!file) return;
    if (net.peer) { toast('Sal de la partida online antes de cambiar de ROM'); return; }
    file.arrayBuffer().then(ab => {
      const bytes = new Uint8Array(ab), name = file.name.replace(EXT_RE, '');
      if (startRom(bytes, name)) storeRom(bytes, name);
    });
  }
  $('fileInput').accept = INFO.extensions.join(',');
  $('fileInput').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
  $('btnForget').onclick = () => forgetRom().then(() => toast('ROM olvidada en este navegador'));

  // ---------- Teclado (CONFIG.keyboard) ----------
  const KEYMAP = {};
  for (const [p, map] of Object.entries(C.keyboard))
    for (const [name, codes] of Object.entries(map))
      if (name in BTN) for (const code of codes) KEYMAP[code] = [+p, BTN[name]];

  const typing = e => e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  window.addEventListener('keydown', e => {
    if (typing(e)) return;
    const m = KEYMAP[e.code];
    if (m) { e.preventDefault(); if (!e.repeat) press(m[0], m[1]); return; }
    if (e.repeat) return;
    switch (e.code) {
      case 'KeyP': togglePause(); break;
      case 'KeyM': toggleMute(); break;
      case 'Minus': setVolume(volume - 10); toast('Volumen ' + volume + '%'); break;
      case 'Equal': setVolume(volume + 10); toast('Volumen ' + volume + '%'); break;
      case 'KeyF': toggleFull(); break;
      case 'F5': e.preventDefault(); saveState(); break;
      case 'F9': e.preventDefault(); loadState(); break;
    }
  });
  window.addEventListener('keyup', e => { const m = KEYMAP[e.code]; if (m) { e.preventDefault(); release(m[0], m[1]); } });
  window.addEventListener('blur', releaseAll);

  // ---------- Mandos (CONFIG.gamepad, mapeo estándar) ----------
  const padState = Array.from({ length: PLAYERS }, () => new Array(NBTN).fill(false));
  const AXES = [['UP', 1, -1], ['DOWN', 1, 1], ['LEFT', 0, -1], ['RIGHT', 0, 1]].filter(([n]) => n in BTN);
  function pollGamepads() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const T = C.gamepad.axisThreshold;
    let idx = 0;
    for (const gp of pads) {
      if (!gp || idx >= PLAYERS) continue;
      const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
      const s = new Array(NBTN).fill(false);
      for (const [name, idxs] of Object.entries(C.gamepad.buttons)) if (name in BTN) s[BTN[name]] = idxs.some(btn);
      for (const [name, axis, sign] of AXES) if ((gp.axes[axis] || 0) * sign > T) s[BTN[name]] = true;
      for (let b = 0; b < NBTN; b++) {
        if (s[b] !== padState[idx][b]) {
          padState[idx][b] = s[b];
          s[b] ? press(idx + 1, b) : release(idx + 1, b);
        }
      }
      idx++;
    }
  }

  // ---------- Interfaz generada desde la configuración ----------
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function buildHelp() {
    const box = $('help'); box.innerHTML = '';
    for (const g of C.help || []) {
      box.appendChild(el('h2', null, g.title));
      const ul = el('ul');
      for (const [label, keys] of g.items) {
        const li = el('li'), k = el('span', 'keys');
        for (const key of keys) k.appendChild(el('kbd', null, key));
        li.append(el('span', null, label), k);
        ul.appendChild(li);
      }
      box.appendChild(ul);
    }
    if (C.helpNote) box.appendChild(el('p', null, C.helpNote));
  }

  function buildTouch() {
    const root = $('touch'); root.innerHTML = '';
    const tb = (name, label) => { const d = el('div', 'tb', label || name); d.dataset.btn = name; return d; };
    if (['UP', 'DOWN', 'LEFT', 'RIGHT'].every(n => n in BTN)) {
      const pad = el('div', 'dpad');
      for (const c of [null, ['UP', '▲'], null, ['LEFT', '◀'], null, ['RIGHT', '▶'], null, ['DOWN', '▼'], null])
        pad.appendChild(c ? tb(c[0], c[1]) : el('span'));
      root.appendChild(pad);
    }
    const mid = el('div', 'mid');
    for (const n of (C.touch && C.touch.center) || []) if (n in BTN) mid.appendChild(tb(n));
    const face = el('div', 'ab');
    for (const n of (C.touch && C.touch.face) || []) if (n in BTN) face.appendChild(tb(n));
    root.append(mid, face);
    root.querySelectorAll('.tb').forEach(b => {
      const bit = BTN[b.dataset.btn];
      const down = e => { e.preventDefault(); b.classList.add('on'); press(1, bit); };
      const up = e => { e.preventDefault(); b.classList.remove('on'); release(1, bit); };
      b.addEventListener('pointerdown', down);
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('pointerleave', up);
    });
  }

  // =====================================================================
  //  ONLINE: lockstep determinista sobre WebRTC (PeerJS) — SPEC.md §9
  //  Ambos navegadores emulan lo mismo; solo se envían los botones de cada
  //  cuadro (con unos cuadros de retardo para absorber la latencia). Cada
  //  uno usa su propia ROM: se comprueba que sean idénticas (SHA-256).
  // =====================================================================
  const PEER_OPTS = { config: { iceServers: NET.iceServers } };
  const net = {
    peer: null, conn: null, role: null, code: null, active: false, syncing: false,
    me: 1, epoch: 0, frame: 0, delay: 3, nextLocal: 0,
    local: new Map(), remote: new Map(), myHash: new Map(), theirHash: new Map(),
    rx: null, tx: null, rtt: 0, rttSamples: [], pingTimer: null, lastAdvance: 0, needResync: false,
  };
  window.__emu = { core, net, CONFIG: C }; // depuración

  function send(msg) { if (net.conn && net.conn.open) net.conn.send(msg); }
  const inputsFor = (local, remote) => net.me === 1 ? [local, remote] : [remote, local];

  function resetLockstep(frame) {
    net.frame = frame;
    net.local.clear(); net.remote.clear(); net.myHash.clear(); net.theirHash.clear();
    for (let f = frame; f < frame + net.delay; f++) { net.local.set(f, 0); net.remote.set(f, 0); }
    net.nextLocal = frame + net.delay;
    net.lastAdvance = performance.now();
    acc = 0;
  }

  function ramHash() {
    const m = core.workRam(); let h = 0x811c9dc5;
    for (let i = 0; i < m.length; i++) { h ^= m[i]; h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  }
  function checkHash(f) {
    const a = net.myHash.get(f), b = net.theirHash.get(f);
    if (a === undefined || b === undefined) return;
    net.myHash.delete(f); net.theirHash.delete(f);
    if (a !== b && net.role === 'host') net.needResync = true;
  }

  function netStep(now) {
    if (net.syncing) { acc = 0; updateStall(now); return false; }
    if (net.needResync) { net.needResync = false; toast('Desincronización detectada: resincronizando…'); hostSync(false); return false; }
    if (acc > FRAME_MS * 4) acc = FRAME_MS * 4;
    let ran = false;
    while (acc >= FRAME_MS) {
      const f = net.frame;
      if (net.nextLocal <= f + net.delay) {           // generar mi entrada para dentro de "delay" cuadros
        const v = sampleMerged();
        net.local.set(net.nextLocal, v);
        send({ t: 'i', e: net.epoch, f: net.nextLocal, v });
        net.nextLocal++;
      }
      const r = net.remote.get(f);
      if (r === undefined) break;                      // falta la entrada del otro: esperar
      core.setInputs(inputsFor(net.local.get(f), r));
      core.runFrame();
      net.local.delete(f); net.remote.delete(f);
      net.frame++; acc -= FRAME_MS; ran = true; net.lastAdvance = now;
      if (f % NET.hashEvery === 0) { const h = ramHash(); net.myHash.set(f, h); send({ t: 'h', e: net.epoch, f, h }); checkHash(f); }
    }
    updateStall(now);
    return ran;
  }

  let stalledShown = false;
  function updateStall(now) {
    const stalled = now - net.lastAdvance > NET.stallMs;
    if (stalled !== stalledShown) { stalledShown = stalled; updateNetUI(); }
  }

  // --- Sincronización completa del estado (inicio de partida o tras una desincronización) ---
  function hostSync(reset) {
    if (reset) core.reset();
    net.syncing = true; net.epoch++;
    const F = net.frame;
    const json = JSON.stringify(core.saveState());     // sin la ROM: el otro usa la suya
    const n = Math.ceil(json.length / NET.chunkSize);
    // Envío con control de flujo: el invitado confirma cada fragmento (enviarlo todo de golpe pierde datos)
    const chunks = [];
    for (let i = 0; i < n; i++) chunks.push(json.slice(i * NET.chunkSize, (i + 1) * NET.chunkSize));
    net.tx = { e: net.epoch, chunks, next: 0, acked: 0 };
    send({ t: 's0', e: net.epoch, f: F, d: net.delay, n });
    pumpChunks();
    applyState(json);                                   // el anfitrión también la aplica: ambos idénticos
    resetLockstep(F);
    updateNetUI();
  }
  function pumpChunks() {
    const tx = net.tx; if (!tx) return;
    while (tx.next < tx.chunks.length && tx.next - tx.acked < NET.chunkWindow) {
      send({ t: 'sc', e: tx.e, i: tx.next, d: tx.chunks[tx.next] }); tx.next++;
    }
    if (tx.acked === tx.chunks.length) { send({ t: 's1', e: tx.e }); net.tx = null; }
  }
  function applyState(json) {
    core.loadState(JSON.parse(json));
    core.setInputs(new Array(PLAYERS).fill(0));
  }

  function onData(m) {
    switch (m.t) {
      case 'i': if (m.e === net.epoch) net.remote.set(m.f, m.v); break;
      case 'h': if (m.e === net.epoch) { net.theirHash.set(m.f, m.h); checkHash(m.f); } break;
      case 'ping': send({ t: 'pong', ts: m.ts }); break;
      case 'pong': onPong(performance.now() - m.ts); break;
      case 'hello': onHello(m); break;
      case 'err': netError(m.msg); endNet(); break;
      // Recepción de estado (invitado)
      case 's0': net.syncing = true; net.rx = { e: m.e, f: m.f, d: m.d, n: m.n, parts: [] }; updateNetUI(); break;
      case 'sc': if (net.rx && m.e === net.rx.e) { net.rx.parts[m.i] = m.d; send({ t: 'sa', e: m.e }); } break;
      case 'sa': if (net.tx && m.e === net.tx.e) { net.tx.acked++; pumpChunks(); } break;
      case 's1': {
        const rx = net.rx; net.rx = null;
        let ok = rx && m.e === rx.e;
        for (let i = 0; ok && i < rx.n; i++) if (typeof rx.parts[i] !== 'string') ok = false;
        if (ok) { try { applyState(rx.parts.join('')); } catch (e) { ok = false; } }
        if (!ok) { netError('Error recibiendo la partida.'); endNet(); return; }
        net.epoch = rx.e; net.delay = rx.d;
        resetLockstep(rx.f);
        net.active = true; net.syncing = false;
        running = true; paused = false; hideOverlay(); initAudio();
        send({ t: 's2', e: rx.e });
        updateNetUI();
        break;
      }
      case 's2': if (m.e === net.epoch) { net.syncing = false; net.lastAdvance = performance.now(); updateNetUI(); } break;
    }
  }

  function onPong(rtt) {
    net.rtt = net.rtt ? net.rtt * 0.8 + rtt * 0.2 : rtt;
    if (net.role === 'host' && !net.active && net.rttSamples) {
      net.rttSamples.push(rtt);
      if (net.rttSamples.length < 3) { send({ t: 'ping', ts: performance.now() }); return; }
      const avg = net.rttSamples.reduce((a, b) => a + b, 0) / net.rttSamples.length;
      net.rttSamples = null;
      net.delay = Math.max(NET.minDelay, Math.min(NET.maxDelay, Math.ceil(avg / 2 / FRAME_MS) + 1));
      net.active = true; paused = false; hideOverlay();
      net.frame = 0;
      hostSync(true);                                  // empezar desde el encendido de la consola
      toast('¡Jugador 2 conectado!');
    }
    updateNetUI();
  }

  async function onHello(m) {
    if (net.role !== 'host') return;
    const mine = await romHash;
    if (m.rom !== mine) {
      send({ t: 'err', msg: 'Tu ROM es distinta a la del anfitrión. Ambos necesitáis exactamente la misma ROM' +
        (currentGame ? ': el Jugador 1 está jugando a «' + currentGame + '».' : '.') });
      setTimeout(() => { if (net.conn) net.conn.close(); }, 300);
      $('waitMsg').textContent = 'Un jugador intentó unirse con una ROM distinta. Esperando al Jugador 2…';
      return;
    }
    net.rttSamples = [];
    send({ t: 'ping', ts: performance.now() });
  }

  function startPing() {
    clearInterval(net.pingTimer);
    net.pingTimer = setInterval(() => send({ t: 'ping', ts: performance.now() }), 1000);
  }

  function bindConn(conn) {
    net.conn = conn;
    conn.on('data', onData);
    conn.on('close', () => { if (net.conn === conn) { const wasActive = net.active; endNet(); if (wasActive || net.role) toast('El otro jugador se ha desconectado'); } });
    conn.on('error', err => console.warn('conn', err));
  }

  // --- Diagnóstico de la conexión directa (ICE) ---
  const ICE_HELP = 'Suele deberse a la protección WebRTC del navegador (en Brave: brave://settings/privacy → ' +
    '«Política de gestión de IP de WebRTC» → «Predeterminada»), a una VPN, un firewall o una red que bloquea P2P.';
  function watchIce(conn, onState) {
    let tries = 0;
    const attach = () => {
      const pc = conn.peerConnection;
      if (!pc) { if (tries++ < 50) setTimeout(attach, 100); return; }
      const report = () => { console.info('[online] ICE', pc.iceConnectionState); onState(pc.iceConnectionState, pc); };
      pc.addEventListener('iceconnectionstatechange', report);
      pc.addEventListener('icecandidateerror', e => console.warn('[online] ICE candidate error', e.url, e.errorCode, e.errorText));
      report();
    };
    attach();
  }
  async function iceDetails(conn) {
    const pc = conn && conn.peerConnection;
    if (!pc) return 'sin conexión WebRTC';
    try {
      const loc = new Set(), rem = new Set();
      (await pc.getStats()).forEach(r => {
        const d = r.candidateType + (r.protocol ? '/' + r.protocol : '');
        if (r.type === 'local-candidate') loc.add(d);
        if (r.type === 'remote-candidate') rem.add(d);
      });
      return 'estado ' + pc.iceConnectionState + '; candidatos propios: ' + ([...loc].join(', ') || 'ninguno') +
        '; del otro: ' + ([...rem].join(', ') || 'ninguno');
    } catch (e) { return 'estado ' + pc.iceConnectionState; }
  }

  function newCode() {
    let c = '';
    for (let i = 0; i < NET.codeLength; i++) c += NET.codeChars[Math.floor(Math.random() * NET.codeChars.length)];
    return c;
  }

  function hostRoom() {
    if (!running) { netError('Carga primero la ROM.'); return; }
    if (typeof Peer === 'undefined') { netError('No se pudo cargar la librería de red.'); return; }
    netError('');
    const code = newCode();
    const peer = new Peer(NET.roomPrefix + code, PEER_OPTS);
    net.peer = peer; net.role = 'host'; net.me = 1; net.code = code;
    $('roomCode').textContent = '·'.repeat(NET.codeLength);
    $('waitMsg').textContent = 'Creando sala…';
    updateNetUI();
    peer.on('open', () => {
      $('roomCode').textContent = code;
      const url = new URL(location.href); url.hash = '';
      url.search = '?sala=' + code + (currentGame ? '&juego=' + encodeURIComponent(currentGame) : '');
      $('roomLink').value = url.toString();
      $('waitMsg').textContent = 'Esperando al Jugador 2…';
    });
    peer.on('connection', conn => {
      if (net.conn && net.conn.open) { conn.on('open', () => { conn.send({ t: 'err', msg: 'La sala ya está llena.' }); setTimeout(() => conn.close(), 300); }); return; }
      bindConn(conn);
      $('waitMsg').textContent = 'Jugador 2 encontrado. Estableciendo conexión directa…';
      const giveUp = async () => {
        if (net.conn !== conn || conn.open) return;
        const d = await iceDetails(conn);
        console.warn('[online] conexión fallida:', d);
        $('waitMsg').textContent = 'El Jugador 2 llegó a la sala pero no se pudo abrir la conexión directa. ' + ICE_HELP +
          ' (' + d + '). Sigues esperando a que alguien se una.';
        try { conn.close(); } catch (e) {}
        net.conn = null;
      };
      setTimeout(giveUp, NET.hostTimeoutMs);
      watchIce(conn, state => { if (state === 'failed') giveUp(); });
      conn.on('open', () => { $('waitMsg').textContent = 'Conectado. Comprobando ROM del Jugador 2…'; startPing(); });
    });
    peer.on('error', err => {
      if (err.type === 'unavailable-id') { peer.destroy(); net.peer = null; hostRoom(); return; }
      if (err.type === 'peer-unavailable') return;
      netError('Error de red: ' + (err.type || err.message)); endNet();
    });
    peer.on('disconnected', () => { if (!net.destroying && peer && !peer.destroyed) peer.reconnect(); });
  }

  function joinRoom(code) {
    code = (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== NET.codeLength) { netError('El código debe tener ' + NET.codeLength + ' caracteres.'); return; }
    if (!running) { netError('Carga primero la ROM.'); return; }
    if (typeof Peer === 'undefined') { netError('No se pudo cargar la librería de red.'); return; }
    netError('');
    const peer = new Peer(PEER_OPTS);
    net.peer = peer; net.role = 'guest'; net.me = 2; net.code = code;
    $('liveMsg').textContent = 'Conectando con el servidor de salas…';
    updateNetUI();
    const fail = async (conn, why) => {
      if (net.peer !== peer) return;
      const d = await iceDetails(conn);
      console.warn('[online] conexión fallida:', why, d);
      netError('No se pudo abrir la conexión directa con el Jugador 1 (' + why + '). ' + ICE_HELP + ' Detalles: ' + d + '.');
      endNet();
    };
    const timer = setTimeout(() => {
      if (net.peer !== peer || (net.conn && net.conn.open)) return;
      if (!peer.open) { netError('No se pudo contactar con el servidor de salas (0.peerjs.com). Revisa la conexión, bloqueadores o extensiones.'); endNet(); }
      else fail(net.conn, 'tiempo agotado');
    }, NET.joinTimeoutMs);
    peer.on('open', () => {
      $('liveMsg').textContent = 'Buscando la sala ' + code + '…';
      const conn = peer.connect(NET.roomPrefix + code, { reliable: true, serialization: 'json' });
      bindConn(conn);
      watchIce(conn, state => {
        if (state === 'checking' && !conn.open) $('liveMsg').textContent = 'Sala ' + code + ' encontrada. Estableciendo conexión directa…';
        if (state === 'failed' && !conn.open) { clearTimeout(timer); fail(conn, 'ICE failed'); }
      });
      conn.on('open', async () => {
        clearTimeout(timer);
        $('liveMsg').textContent = 'Conectado. Comprobando ROM…';
        send({ t: 'hello', rom: await romHash });
        startPing();
      });
    });
    peer.on('error', err => {
      netError(err.type === 'peer-unavailable' ? 'No existe ninguna sala con el código ' + code + '.' : 'Error de red: ' + (err.type || err.message));
      endNet();
    });
  }

  function endNet() {
    net.destroying = true;
    clearInterval(net.pingTimer);
    const c = net.conn, p = net.peer;
    Object.assign(net, { peer: null, conn: null, role: null, code: null, active: false, syncing: false, rx: null, tx: null, rtt: 0, rttSamples: [], needResync: false });
    try { c && c.close(); } catch (e) {}
    try { p && p.destroy(); } catch (e) {}
    net.destroying = false;
    releaseAll();
    stalledShown = false;
    updateNetUI();
  }
  window.addEventListener('beforeunload', () => { if (net.peer) net.peer.destroy(); });

  // --- Interfaz online ---
  function netError(msg) { $('netError').textContent = msg || ''; }
  function openPanel() { $('netPanel').hidden = false; updateNetUI(); }
  function updateNetUI() {
    const st = $('netStatus');
    if (net.active) {
      st.hidden = false;
      const waiting = net.syncing || stalledShown;
      st.className = waiting ? 'wait' : '';
      st.textContent = (waiting ? 'Esperando al otro jugador… · ' : 'Online · ') + 'Jugador ' + net.me +
        ' · ' + Math.round(net.rtt) + ' ms';
    } else if (net.role === 'host') { st.hidden = false; st.className = 'wait'; st.textContent = 'Sala ' + (net.code || '') + ' · esperando'; }
    else if (net.role === 'guest') { st.hidden = false; st.className = 'wait'; st.textContent = 'Conectando…'; }
    else st.hidden = true;

    $('netIdle').hidden = !!net.role;
    $('netWaiting').hidden = !(net.role === 'host' && !net.active);
    $('netLive').hidden = !(net.active || net.role === 'guest');
    if (net.active) $('liveMsg').innerHTML = 'Partida en curso como <b>Jugador ' + net.me + '</b>. Retardo de entrada: ' +
      net.delay + ' cuadros, ping ' + Math.round(net.rtt) + ' ms.' +
      (net.me === 1 ? '<br><span class="muted">Elige el modo de 2 jugadores en el menú del juego.</span>' :
                      '<br><span class="muted">El Jugador 1 elige el modo en el menú del juego.</span>');
    $('btnLeave').hidden = !net.role;
    $('btnOnline').textContent = net.role ? 'Online ●' : 'Online';
    for (const id of ['btnPause', 'btnReset', 'btnSave', 'btnLoad']) $(id).disabled = !!net.role;
  }

  $('btnOnline').onclick = openPanel;
  $('btnClose').onclick = () => { $('netPanel').hidden = true; };
  $('netPanel').addEventListener('pointerdown', e => { if (e.target.id === 'netPanel') $('netPanel').hidden = true; });
  $('btnHost').onclick = () => { initAudio(); hostRoom(); };
  $('btnJoin').onclick = () => { initAudio(); joinRoom($('joinCode').value); };
  $('joinCode').maxLength = NET.codeLength;
  $('joinCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnJoin').click(); });
  $('btnLeave').onclick = () => { endNet(); netError(''); toast('Has salido de la partida online'); };
  $('btnCopy').onclick = () => {
    const v = $('roomLink').value;
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(
      () => toast('Enlace copiado'), () => { $('roomLink').select(); document.execCommand('copy'); toast('Enlace copiado'); });
  };

  // ---------- Opciones ----------
  const toastEl = $('toast');
  let toastT;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1800); }

  const offlineOnly = () => { if (net.role) { toast('No disponible en partida online'); return false; } return running; };
  function togglePause() {
    if (!offlineOnly()) return;
    paused = !paused;
    $('btnPause').textContent = paused ? 'Continuar' : 'Pausa';
    if (audioCtx) paused ? audioCtx.suspend() : audioCtx.resume();
    toast(paused ? 'Pausa' : 'Continuar');
  }

  // Volumen (0–100, curva cuadrática para que el control sea más natural al oído)
  let volume = 80;
  function outputGain() { return muted ? 0 : Math.pow(volume / 100, 2); }
  function applyVolume() {
    if (gain) gain.gain.setTargetAtTime(outputGain(), audioCtx.currentTime, 0.015);
    const silent = muted || volume === 0;
    $('btnMute').textContent = silent ? '🔇' : volume < 50 ? '🔉' : '🔊';
    $('btnMute').setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar');
    $('volume').value = volume;
    $('volume').style.opacity = muted ? 0.45 : 1;
    $('volLabel').textContent = muted ? 'off' : volume + '%';
    try { localStorage.setItem(C.storage.volume, JSON.stringify({ volume, muted })); } catch (e) {}
  }
  function setVolume(v) { volume = Math.max(0, Math.min(100, Math.round(v))); if (volume > 0) muted = false; applyVolume(); }
  function toggleMute() { muted = !muted; applyVolume(); toast(muted ? 'Sonido silenciado' : 'Volumen ' + volume + '%'); }
  try {
    const s = JSON.parse(localStorage.getItem(C.storage.volume) || 'null');
    if (s && typeof s.volume === 'number') { volume = Math.max(0, Math.min(100, s.volume)); muted = !!s.muted; }
  } catch (e) {}
  $('volume').addEventListener('input', e => { initAudio(); setVolume(+e.target.value); });
  $('volume').addEventListener('change', e => e.target.blur()); // devolver el teclado al juego

  function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen();
    else canvas.requestFullscreen && canvas.requestFullscreen();
  }
  function saveState() {
    if (!offlineOnly()) return;
    try { localStorage.setItem(C.storage.statePrefix + romKey, JSON.stringify(core.saveState())); toast('Partida guardada'); }
    catch (e) { toast('No se pudo guardar: ' + e.message); }
  }
  function loadState() {
    if (!offlineOnly()) return;
    try {
      const s = localStorage.getItem(C.storage.statePrefix + romKey);
      if (!s) { toast('No hay partida guardada'); return; }
      core.loadState(JSON.parse(s)); toast('Partida cargada');
    } catch (e) { toast('No se pudo cargar: ' + e.message); }
  }

  $('btnPause').onclick = togglePause;
  $('btnReset').onclick = () => { if (offlineOnly()) { core.reset(); toast('Reset'); } };
  $('btnSave').onclick = saveState;
  $('btnLoad').onclick = loadState;
  $('btnMute').onclick = () => { initAudio(); toggleMute(); };
  $('btnFull').onclick = toggleFull;
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

  // ---------- Arranque ----------
  document.title = C.appName;
  $('appName').textContent = C.appName;
  buildHelp();
  buildTouch();
  applyVolume();
  requestAnimationFrame(loop);

  // Orden: juego de la invitación → ROM local (desarrollo) → último juego usado → pedir juego
  loadCatalog().then(async () => {
    if (inviteGame && findGame(inviteGame) && await loadGame(inviteGame)) return;
    if (C.localRom) {
      try {
        const r = await fetch(C.localRom.url);
        if (r.ok && startRom(new Uint8Array(await r.arrayBuffer()), C.localRom.name)) return;
      } catch (e) {}
    }
    const rec = await getStoredRom();
    if (rec && rec.bytes && startRom(new Uint8Array(rec.bytes), rec.name)) return;
    showOverlay(NO_ROM_MSG + (inviteCode ? '<br><br><b>Te han invitado a una partida online.</b> Elige el mismo juego para unirte.' : ''));
  });
})();
</script>
</body>
</html>
